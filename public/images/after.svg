<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Placeholder "after" mockup: a believable, hand-made trade website. Swap for a real screenshot. -->
  <rect width="1600" height="1000" fill="#f4efe4"/>

  <!-- Utility bar -->
  <rect width="1600" height="44" fill="#1c1a17"/>
  <g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" fill="#e9e2d3">
    <text x="80" y="28">Licensed &amp; insured · Lic. no. 284716C</text>
    <text x="1520" y="28" text-anchor="end">Mon–Sat 7am–6pm · Emergencies 24/7</text>
  </g>

  <!-- Nav -->
  <rect x="80" y="62" width="44" height="44" rx="3" fill="#c8461d"/>
  <text x="102" y="96" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="30" fill="#f4efe4">J</text>
  <text x="140" y="92" font-family="Georgia,serif" font-weight="700" font-size="29" fill="#1c1a17">Joe’s Plumbing</text>
  <g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" fill="#1c1a17">
    <text x="760" y="91">Services</text><text x="860" y="91">Areas</text><text x="940" y="91">Reviews</text><text x="1035" y="91">About</text>
    <text x="1180" y="91" font-weight="700">(02) 9xxx xxxx</text>
  </g>
  <rect x="1372" y="60" width="148" height="48" rx="4" fill="#c8461d"/>
  <text x="1446" y="90" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="700" font-size="17" fill="#fff">Book a job</text>
  <line x1="80" y1="128" x2="1520" y2="128" stroke="#d9d0bf" stroke-width="1.5"/>

  <!-- Hero copy -->
  <text x="80" y="205" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="700" font-size="14" letter-spacing="2.5" fill="#c8461d">BLOCKED DRAINS · HOT WATER · GAS</text>
  <g font-family="Georgia,serif" font-weight="700" font-size="76" fill="#1c1a17" letter-spacing="-1.5">
    <text x="76" y="295">Blocked drain?</text>
    <text x="76" y="381">We’ll be there</text>
    <text x="76" y="467" font-style="italic" fill="#c8461d">this arvo.</text>
  </g>
  <g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#5f584e">
    <text x="80" y="530">Local, licensed plumbers on the Lower North Shore.</text>
    <text x="80" y="562">Upfront quotes before we start. No call-out fee on weekdays.</text>
  </g>
  <rect x="80" y="604" width="236" height="60" rx="4" fill="#c8461d"/>
  <text x="198" y="641" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="700" font-size="20" fill="#fff">Book a plumber</text>
  <text x="346" y="641" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" fill="#1c1a17">or call <tspan font-weight="700" text-decoration="underline">(02) 9xxx xxxx</tspan></text>

  <!-- Review -->
  <line x1="80" y1="712" x2="700" y2="712" stroke="#d9d0bf" stroke-width="1.5"/>
  <text x="80" y="758" font-family="Arial,sans-serif" font-size="22" fill="#c8461d" letter-spacing="2">★★★★★</text>
  <text x="222" y="756" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" fill="#5f584e">4.9 from 212 Google reviews</text>
  <g font-family="Georgia,serif" font-style="italic" font-size="24" fill="#1c1a17">
    <text x="80" y="808">“Came out on a Sunday, sorted our hot water in</text>
    <text x="80" y="842">an hour and didn’t charge extra for it.”</text>
  </g>
  <text x="80" y="882" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" fill="#5f584e">Priya M., Cammeray</text>

  <!-- Photo placeholder: the van on a street -->
  <clipPath id="photo"><rect x="820" y="168" width="700" height="460" rx="4"/></clipPath>
  <g clip-path="url(#photo)">
    <rect x="820" y="168" width="700" height="460" fill="#d6dcd9"/>
    <rect x="820" y="168" width="700" height="250" fill="#c9bba4"/>
    <g fill="#b8a98f"><rect x="850" y="200" width="120" height="150"/><rect x="1010" y="200" width="120" height="150"/><rect x="1170" y="200" width="120" height="150"/><rect x="1330" y="200" width="120" height="150"/></g>
    <g fill="#8f8a80"><rect x="862" y="212" width="96" height="126"/><rect x="1022" y="212" width="96" height="126"/><rect x="1182" y="212" width="96" height="126"/><rect x="1342" y="212" width="96" height="126"/></g>
    <rect x="820" y="560" width="700" height="68" fill="#7d786f"/>
    <rect x="820" y="548" width="700" height="14" fill="#a39d92"/>
    <!-- van -->
    <rect x="1018" y="292" width="300" height="10" rx="2" fill="#6d6a65"/>
    <g stroke="#6d6a65" stroke-width="5"><line x1="1040" y1="302" x2="1040" y2="330"/><line x1="1296" y1="302" x2="1296" y2="330"/></g>
    <path d="M900 330 h400 a14 14 0 0 1 14 14 v20 l78 70 a20 20 0 0 1 8 16 v80 a12 12 0 0 1 -12 12 h-488 a12 12 0 0 1 -12 -12 v-186 a14 14 0 0 1 14 -14 z" fill="#c8461d"/>
    <path d="M1318 368 l70 62 h-70 z" fill="#2f3a3d"/>
    <rect x="1320" y="452" width="22" height="6" rx="2" fill="#9a3614"/>
    <text x="930" y="420" font-family="Georgia,serif" font-weight="700" font-size="40" fill="#f4efe4">Joe’s Plumbing</text>
    <text x="932" y="456" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" fill="#f4efe4">(02) 9xxx xxxx · Lic. 284716C</text>
    <line x1="1300" y1="344" x2="1300" y2="540" stroke="#9a3614" stroke-width="2"/>
    <g><circle cx="980" cy="552" r="40" fill="#22201d"/><circle cx="980" cy="552" r="17" fill="#9b968d"/><circle cx="1340" cy="552" r="40" fill="#22201d"/><circle cx="1340" cy="552" r="17" fill="#9b968d"/></g>
  </g>
  <text x="820" y="660" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" fill="#5f584e">Our van. Probably parked on your street at some point this week.</text>

  <!-- Services with prices -->
  <text x="820" y="732" font-family="Georgia,serif" font-weight="700" font-size="28" fill="#1c1a17">What we fix</text>
  <g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" fill="#1c1a17">
    <line x1="820" y1="752" x2="1520" y2="752" stroke="#1c1a17" stroke-width="1.5"/>
    <text x="820" y="785">Blocked drains</text><text x="1520" y="785" text-anchor="end" fill="#5f584e">from $180</text>
    <line x1="820" y1="802" x2="1520" y2="802" stroke="#d9d0bf" stroke-width="1.5"/>
    <text x="820" y="835">Hot water repairs &amp; installs</text><text x="1520" y="835" text-anchor="end" fill="#5f584e">from $240</text>
    <line x1="820" y1="852" x2="1520" y2="852" stroke="#d9d0bf" stroke-width="1.5"/>
    <text x="820" y="885">Gas fitting &amp; leak checks</text><text x="1520" y="885" text-anchor="end" fill="#5f584e">quoted on site</text>
    <line x1="820" y1="902" x2="1520" y2="902" stroke="#d9d0bf" stroke-width="1.5"/>
  </g>

  <!-- Suburbs -->
  <rect y="944" width="1600" height="56" fill="#1c1a17"/>
  <text x="800" y="978" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" letter-spacing="1" fill="#e9e2d3">Crows Nest · Cammeray · Neutral Bay · St Leonards · Artarmon · Naremburn · Willoughby</text>
</svg>
